<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ליגת הצ'יפים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Rubik:wght@500;600;700&family=Secular+One&display=swap">
<style>
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: a fixtures ledger with tactile odds chips; the betting slip rides alongside on desktop and rises as a sheet on phones. */
:root{
  --bg:#EBEFEA; --surface:#FFFFFF; --sunk:#F4F6F3; --ink:#15221B; --muted:#5D6A62; --line:#D2DAD3;
  --pitch:#1E5A3C; --pitch-ink:#F2F6F1; --accent:#E0531C; --accent-ink:#FFFFFF; --accent-soft:#FBE3D8;
  --won:#24804F; --lost:#B9372B; --wait:#A87412; --won-soft:#DCEFE3; --lost-soft:#F6DEDB; --wait-soft:#F5EBD3;
  --f-display:"Secular One","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-num:"Rubik","Assistant",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1511; --surface:#16201A; --sunk:#121A15; --ink:#E6ECE7; --muted:#97A59C; --line:#27352C;
  --pitch:#163B28; --pitch-ink:#EAF1EB; --accent:#FF7440; --accent-ink:#1A0D06; --accent-soft:#3A2116;
  --won:#4FC17F; --lost:#F0705F; --wait:#E1A93E; --won-soft:#173323; --lost-soft:#3A1C18; --wait-soft:#33290F;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1511; --surface:#16201A; --sunk:#121A15; --ink:#E6ECE7; --muted:#97A59C; --line:#27352C;
  --pitch:#163B28; --pitch-ink:#EAF1EB; --accent:#FF7440; --accent-ink:#1A0D06; --accent-soft:#3A2116;
  --won:#4FC17F; --lost:#F0705F; --wait:#E1A93E; --won-soft:#173323; --lost-soft:#3A1C18; --wait-soft:#33290F;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--pitch)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{background:var(--pitch);color:var(--pitch-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:12px 0;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:26px;letter-spacing:.2px;line-height:1;display:flex;align-items:baseline;gap:10px}
.brand small{font-family:var(--f-body);font-size:13px;opacity:.75;font-weight:600}
.wallet{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
.chip-pill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 12px 5px 6px;font-weight:700}
.chip-pill .coin{width:22px;height:22px;border-radius:50%;background:var(--accent);box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),inset 0 0 0 6px var(--accent);flex:none}
.chip-pill b{font-family:var(--f-num);font-size:17px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:2px;width:100%;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;color:var(--pitch-ink);opacity:.72;padding:12px 14px 11px;font-weight:700;font-size:15px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-current="true"]{opacity:1;border-bottom-color:var(--accent)}
.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-inline-start:6px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:12px;line-height:18px;font-family:var(--f-num)}

/* page grid */
.page{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;padding-block:20px 120px;align-items:start}
.page.full{grid-template-columns:minmax(0,1fr)}
@media (max-width:960px){.page{grid-template-columns:minmax(0,1fr)}}

.notice{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:16px}
.notice h3{margin:0 0 4px;font-family:var(--f-display);font-weight:400;font-size:19px}
.notice p{margin:0;color:var(--muted)}
.notice.warn{border-color:var(--wait);background:var(--wait-soft)}
.notice .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* filters */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-weight:700;font-size:14px;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fchip .n{font-family:var(--f-num);font-weight:500;opacity:.7;margin-inline-start:4px;font-size:12px}
.searchbox{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px}

/* day group */
.day{margin-top:22px}
.day-h{display:flex;align-items:baseline;gap:10px;margin:0 2px 8px}
.day-h h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px}
.day-h span{color:var(--muted);font-size:13px;font-weight:600}
.board{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mrow{display:grid;grid-template-columns:62px minmax(0,1fr) auto auto auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow.closed{opacity:.62}
.ko{font-family:var(--f-num);font-weight:600;font-size:15px;line-height:1.1}
.ko small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:600;margin-top:3px}
.teams{min-width:0}
.teams .t{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teams .meta{font-size:12px;color:var(--muted);font-weight:600;display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:4px}
.tag.est::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted)}
.tag.mkt::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--won)}
.oddset{display:grid;grid-auto-flow:column;gap:5px}
.oddset .lbl{font-size:11px;color:var(--muted);text-align:center;font-weight:700;margin-bottom:3px}
.odd{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:58px;height:44px;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:0 6px;transition:background .12s,border-color .12s}
.odd b{font-family:var(--f-num);font-weight:600;font-size:15.5px;font-variant-numeric:tabular-nums}
.odd span{font-size:11px;color:var(--muted);font-weight:700;line-height:1}
.odd:hover:not(:disabled){border-color:var(--ink)}
.odd[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.odd[aria-pressed="true"] span{color:var(--accent-ink);opacity:.85}
.odd:disabled{cursor:not-allowed;opacity:.5}
.more{border:0;background:none;color:var(--ink);font-weight:800;font-family:var(--f-num);font-size:14px;padding:8px 6px;border-radius:8px;white-space:nowrap}
.more:hover{background:var(--sunk)}
.score{font-family:var(--f-num);font-weight:700;font-size:18px;padding:4px 10px;border-radius:8px;background:var(--sunk)}
@media (max-width:640px){
  .mrow{grid-template-columns:52px minmax(0,1fr) auto;row-gap:10px}
  .mrow .oddset.main{grid-column:1 / -1}
  .mrow .oddset.ou{display:none}
  .oddset.main{grid-template-columns:repeat(3,1fr)}
  .odd{min-width:0}
  .mrow .more{grid-row:1;grid-column:3;align-self:start}
  .brand small{display:none}
  .top .wrap{padding-block:10px 0}
  .tabs button{padding:10px 12px 9px}
}

/* markets panel */
.markets{background:var(--sunk);border-top:1px solid var(--line);padding:6px 14px 16px}
.mgroup{padding-top:12px}
.mgroup h4{margin:0 0 7px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.3px}
.mgrid{display:grid;gap:5px;grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.mgrid.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}
.mgrid.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}
.mgrid .odd{flex-direction:row;justify-content:space-between;height:40px;background:var(--surface);gap:6px;min-width:0}
.mgrid .odd[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.mgrid .odd[aria-pressed="true"] span{color:var(--accent-ink)}
.mgrid .odd span{font-size:13px;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.mtabs{display:flex;gap:4px;flex-wrap:wrap;padding-top:10px}
.mtabs button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;font-size:13px;font-weight:700;color:var(--muted)}
.mtabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.src{font-size:12px;color:var(--muted);margin-top:12px}

/* slip */
.slip{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.slip-h{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:var(--ink);color:var(--bg)}
.slip-h h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:19px}
.slip-h button{background:none;border:0;color:inherit;opacity:.7;font-weight:700;font-size:13px}
.slip-empty{padding:26px 18px;color:var(--muted);text-align:center}
.slip-empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.legs{max-height:46vh;overflow:auto}
.leg{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:start;padding:11px 16px;border-bottom:1px dashed var(--line)}
.leg .sel{font-weight:700}
.leg .mk{font-size:12.5px;color:var(--muted)}
.leg .mt{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg .o{font-family:var(--f-num);font-weight:700}
.leg .x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:0 2px}
.leg.bad{background:var(--lost-soft)}
.slip-f{padding:14px 16px;display:grid;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.stake{display:flex;gap:6px;align-items:center}
.stake input{flex:1;min-width:0;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 12px;font-family:var(--f-num);font-size:17px;font-weight:600}
.quick{display:flex;gap:5px}
.quick button{flex:1;border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:5px 0;font-family:var(--f-num);font-size:13px;font-weight:600}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.sum dt{color:var(--muted)}
.sum dd{margin:0;font-family:var(--f-num);font-weight:700;text-align:end}
.sum .big{font-size:20px;color:var(--accent)}
.btn{border:0;border-radius:8px;padding:11px 16px;font-weight:800;font-size:15.5px;background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13.5px}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.danger{background:var(--surface);color:var(--lost);border:1px solid var(--lost)}
.err{color:var(--lost);font-size:13.5px;font-weight:600}
.ok{color:var(--won);font-size:13.5px;font-weight:700}

/* mobile slip bar */
.slipbar{display:none}
@media (max-width:960px){
  .slip-col{display:none}
  .slip-col.open{display:block;position:fixed;inset:auto 0 0 0;z-index:40;max-height:88vh;overflow:auto;padding:0 max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
  .slip-col.open .slip{position:static;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39}
  .slipbar{display:flex;position:fixed;z-index:35;inset:auto 0 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--ink);color:var(--bg);align-items:center;gap:12px;border:0;width:100%;text-align:start}
  .slipbar .cnt{background:var(--accent);color:var(--accent-ink);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-family:var(--f-num);font-weight:700}
  .slipbar b{font-weight:800}
  .slipbar .num{margin-inline-start:auto;font-weight:700}
}

/* tables */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 2px 10px;flex-wrap:wrap}
.sec-h:first-child{margin-top:4px}
.sec-h h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px}
.sec-h p{margin:0;color:var(--muted);font-size:13.5px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:start;font-size:12px;color:var(--muted);font-weight:800;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:end;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.rank{font-family:var(--f-display);font-size:20px;width:44px;color:var(--muted)}
tr.lead .rank{color:var(--accent)}
.who{display:flex;align-items:center;gap:9px;font-weight:700;min-width:0}
.who img{width:26px;height:26px;border-radius:50%;flex:none}
.you{font-size:11px;font-weight:800;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 4px}
.pos{color:var(--won)} .neg{color:var(--lost)}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.won{background:var(--won-soft);color:var(--won)}
.pill.lost{background:var(--lost-soft);color:var(--lost)}
.pill.pending{background:var(--wait-soft);color:var(--wait)}
.pill.void{background:var(--sunk);color:var(--muted)}

/* bets list */
.tickets{display:grid;gap:10px}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;border-inline-start:4px solid var(--line)}
.ticket.won{border-inline-start-color:var(--won)} .ticket.lost{border-inline-start-color:var(--lost)} .ticket.pending{border-inline-start-color:var(--wait)}
.ticket-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.ticket-h .kind{font-weight:800}
.ticket-h .when{color:var(--muted);font-size:12.5px}
.ticket-h .pill{margin-inline-start:auto}
.ticket .leg{grid-template-columns:minmax(0,1fr) auto auto;padding:9px 14px}
.ticket-f{display:flex;gap:18px;padding:10px 14px;background:var(--sunk);font-size:13.5px;flex-wrap:wrap}
.ticket-f span{color:var(--muted)}
.ticket-f b{font-family:var(--f-num)}
.mini{font-size:12px;font-weight:800}
.mini.won{color:var(--won)} .mini.lost{color:var(--lost)} .mini.void{color:var(--muted)} .mini.pending{color:var(--wait)}

/* admin */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.field{display:grid;gap:4px}
.field label{font-size:12.5px;font-weight:800;color:var(--muted)}
.inp{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
.inp.num{font-family:var(--f-num)}
.inp.s{width:64px;text-align:center}
.inp.m{width:96px}
.hstack{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.admin-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.empty{padding:22px;text-align:center;color:var(--muted)}
.foot{color:var(--muted);font-size:12.5px;padding-block:8px 30px}
.toast{position:fixed;z-index:60;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{transform:translate(-50%,8px);opacity:0}}}
</style>

</head>
<body>
<div id="app">
  <header class="top">
    <div class="wrap">
      <div class="brand">ליגת הצ'יפים <small>הימורים בין חברים · בלי כסף אמיתי</small></div>
      <div class="wallet" id="wallet"></div>
      <nav class="tabs" id="tabs" aria-label="ניווט"></nav>
    </div>
  </header>
  <div class="wrap">
    <div class="page" id="page">
      <main id="view" aria-live="polite"><div class="notice"><h3>טוען את המשחקים…</h3><p>מתחבר למאגר של הליגה.</p></div></main>
      <aside class="slip-col" id="slipcol"></aside>
    </div>
  </div>
  <div id="scrim"></div>
  <button class="slipbar" id="slipbar" hidden></button>
  <div id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
document.documentElement.lang = "he"; document.documentElement.dir = "rtl";

/* ---------- odds model ---------- */
const RHO = -0.07, N = 11;
function fact(n){let f=1;for(let i=2;i<=n;i++)f*=i;return f}
const FACT = Array.from({length:N},(_,i)=>fact(i));
function matrix(lh,la){
  const P=[];let s=0;
  for(let i=0;i<N;i++){P[i]=[];for(let j=0;j<N;j++){
    let p=Math.exp(-lh)*lh**i/FACT[i]*Math.exp(-la)*la**j/FACT[j];
    if(i===0&&j===0)p*=1-lh*la*RHO;else if(i===0&&j===1)p*=1+lh*RHO;else if(i===1&&j===0)p*=1+la*RHO;else if(i===1&&j===1)p*=1-RHO;
    P[i][j]=p;s+=p}}
  for(let i=0;i<N;i++)for(let j=0;j<N;j++)P[i][j]/=s;
  return P;
}
function summary(P){let H=0,D=0,A=0,O=0;for(let i=0;i<N;i++)for(let j=0;j<N;j++){const p=P[i][j];if(i>j)H+=p;else if(i===j)D+=p;else A+=p;if(i+j>2)O+=p}return{H,D,A,O}}
const fitCache = new Map();
function fitLambdas(o){
  const key=[o.h,o.d,o.a,o.o,o.u].join("|");
  if(fitCache.has(key))return fitCache.get(key);
  const ih=1/o.h,id=1/o.d,ia=1/o.a,s=ih+id+ia, tH=ih/s,tA=ia/s;
  const io=1/o.o,iu=1/o.u,tO=io/(io+iu);
  const err=(lh,la)=>{const r=summary(matrix(lh,la));return (r.H-tH)**2+(r.A-tA)**2+(r.O-tO)**2};
  let best=[1.4,1.1],be=Infinity;
  for(let lh=0.2;lh<=4.4;lh+=0.15)for(let la=0.2;la<=4.4;la+=0.15){const e=err(lh,la);if(e<be){be=e;best=[lh,la]}}
  for(const step of [0.03,0.006]){const [ch,ca]=best;
    for(let dh=-6;dh<=6;dh++)for(let da=-6;da<=6;da++){const lh=ch+dh*step,la=ca+da*step;if(lh<=0.05||la<=0.05)continue;const e=err(lh,la);if(e<be){be=e;best=[lh,la]}}}
  fitCache.set(key,best);return best;
}

/* selection ids -> settle predicate. true=won, false=lost, null=void(refund) */
function pred(id,h,a){
  const p=id.split(":"),t=p[0],r=h>a?"H":h<a?"A":"D",T=h+a;
  switch(t){
    case "1x2":return p[1]===r;
    case "dc":return p[1]==="1X"?r!=="A":p[1]==="12"?r!=="D":r!=="H";
    case "dnb":return r==="D"?null:p[1]===r;
    case "ou":{const L=+p[1];return p[2]==="O"?T>L:T<L}
    case "htg":{const L=+p[1];return p[2]==="O"?h>L:h<L}
    case "atg":{const L=+p[1];return p[2]==="O"?a>L:a<L}
    case "btts":return (h>0&&a>0)===(p[1]==="Y");
    case "ah":{const d=h+(+p[1])-a;return p[2]==="H"?d>0:d<0}
    case "cs":{if(p[1].includes("-")){const[x,y]=p[1].split("-").map(Number);return h===x&&a===y}return (h>4||a>4)&&p[1][0]===r}
    case "mg":{const k=p[1];if(k==="D")return r==="D";const diff=k[0]==="H"?h-a:a-h,n=+k[1];return n===3?diff>=3:diff===n}
    case "oe":return (T%2===1)===(p[1]==="O");
    case "tg":{const n=+p[1];return n===6?T>=6:T===n}
    case "cln":{const c=p[1]==="H"?a:h;return (c===0)===(p[2]==="Y")}
    case "wtn":return p[1]==="H"?(h>a&&a===0):(a>h&&h===0);
    case "rb":return r===p[1]&&((h>0&&a>0)===(p[2]==="Y"));
    case "ro":return r===p[1]&&(p[2]==="O"?T>2.5:T<2.5);
    /* basketball: final score including overtime */
    case "bw":return r==="D"?null:p[1]===r;
    case "bs":{const d=h+(+p[1])-a;return d===0?null:p[2]==="H"?d>0:d<0}
    case "bt":{const L=+p[1];return T===L?null:p[2]==="O"?T>L:T<L}
    case "bht":{const L=+p[1];return h===L?null:p[2]==="O"?h>L:h<L}
    case "bat":{const L=+p[1];return a===L?null:p[2]==="O"?a>L:a<L}
    case "bm":{const k=p[1],diff=k[0]==="H"?h-a:a-h,b=+k[1],lo=(b-1)*5+1;return b===4?diff>=16:diff>=lo&&diff<=lo+4}
    case "boe":return (T%2===1)===(p[1]==="O");

}
function nice(x){
  if(!isFinite(x))return null;
  if(x<1.01)x=1.01;
  if(x<2)return Math.round(x*100)/100;
  if(x<5)return Math.round(x*20)/20;
  if(x<15)return Math.round(x*4)/4;
  if(x<40)return Math.round(x);
  if(x<100)return Math.round(x/5)*5;
  return Math.min(500,Math.round(x/25)*25);
}
const fmtO = x => x==null?"—":(x<10?x.toFixed(2):x<100?(Number.isInteger(x)?String(x):x.toFixed(2)):String(x));

const mktCache=new Map();

/* basketball: margin and total as independent normals on integer scores */
const SD_M=12, SD_T=15;
function ncdf(x){const t=1/(1+0.2316419*Math.abs(x)),d=0.3989423*Math.exp(-x*x/2),q=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return x>0?1-q:q}
function ninv(p){p=Math.min(0.999,Math.max(0.001,p));let lo=-6,hi=6;for(let i=0;i<50;i++){const mid=(lo+hi)/2;if(ncdf(mid)<p)lo=mid;else hi=mid}return (lo+hi)/2}
function bbCells(o,SD_M,SD_T){
  const pc=(1/o.sh)/((1/o.sh)+(1/o.sa)), po=(1/o.o)/((1/o.o)+(1/o.u));
  const mu=-o.sl+SD_M*ninv(pc), T=o.tl+SD_T*ninv(po);
  const pm=x=>ncdf((x+0.5-mu)/SD_M)-ncdf((x-0.5-mu)/SD_M), pt=x=>ncdf((x+0.5-T)/SD_T)-ncdf((x-0.5-T)/SD_T);
  const cells=[];let s=0;
  for(let mg=Math.round(mu-4*SD_M);mg<=Math.round(mu+4*SD_M);mg++){if(mg===0)continue;const a=pm(mg);
    for(let t=Math.round(T-4*SD_T);t<=Math.round(T+4*SD_T);t++){if((t+mg)%2)continue;const h=(t+mg)/2,aw=(t-mg)/2;if(aw<0||h<0)continue;const p=a*pt(t);cells.push([h,aw,p]);s+=p}}
  for(const c of cells)c[2]/=s;
  return{cells,mu,T};
}
function buildBB(m){
  const o=m.odds,H=m.home,A=m.away,{cells,mu,T}=bbCells(o,m.sdm||SD_M,m.sdt||SD_T);
  const price=(id,margin)=>{let w=0,v=0;for(const [h,a,p] of cells){const r=pred(id,h,a);if(r===true)w+=p;else if(r===null)v+=p}
    if(v>=0.999)return null;const f=w/(1-v);if(f<0.01)return null;return nice(1/(f*margin))};
  const G=[];
  const g=(key,title,cat,sels,margin,cols)=>G.push({key,title,cat,cols,sels:sels.map(([id,label,fixed])=>({id,label,odds:fixed??price(id,margin)})).filter(s=>s.odds)});
  const sg=x=>ltr((x>0?"+":"")+x);
  g("bw","מנצחת (כולל הארכה)","main",[["bw:H",H,o.h],["bw:A",A,o.a]],1,2);
  const base=Math.round(-mu)+0.5;
  const lines=[...new Set([o.sl,...[-9,-6,-3,3,6,9].map(d=>base+d)])].sort((x,y)=>x-y);
  for(const L of lines){const main=L===o.sl;
    g("bs"+L,(main?"הנדיקפ ראשי ":"הנדיקפ ")+H+" "+sg(L),"hcp",[["bs:"+L+":H",H+" ("+sg(L)+")",main?o.sh:undefined],["bs:"+L+":A",A+" ("+sg(-L)+")",main?o.sa:undefined]],1.05,2)}
  const tb=Math.round(T)+0.5;
  const tls=[...new Set([o.tl,...[-10,-5,5,10].map(d=>tb+d)])].sort((x,y)=>x-y);
  for(const L of tls){const main=L===o.tl;
    g("bt"+L,(main?"סה\"כ נקודות ":"סה\"כ נקודות ")+L,"goals",[["bt:"+L+":O","מעל "+L,main?o.o:undefined],["bt:"+L+":U","מתחת "+L,main?o.u:undefined]],1.05,2)}
  g("boe","סה\"כ זוגי / אי-זוגי","goals",[["boe:O","אי-זוגי"],["boe:E","זוגי"]],1.05,2);
  const ht=Math.round((T+mu)/2)+0.5, at=Math.round((T-mu)/2)+0.5;
  for(const [k,n,L] of [["bht",H,ht],["bat",A,at]])
    g(k+L,"נקודות של "+n+" "+L,"teams",[[k+":"+L+":O","מעל "+L],[k+":"+L+":U","מתחת "+L]],1.06,2);
  g("bm","הפרש ניצחון","margin",[["bm:H1",H+" ב-1–5"],["bm:H2",H+" ב-6–10"],["bm:H3",H+" ב-11–15"],["bm:H4",H+" ב-16+"],["bm:A1",A+" ב-1–5"],["bm:A2",A+" ב-6–10"],["bm:A3",A+" ב-11–15"],["bm:A4",A+" ב-16+"]],1.12,2);
  return G;
}
function buildMarkets(m){
  if(m.sport==="bb")return buildBB(m);
  const o=m.odds, H=m.home, A=m.away;
  const P=matrix(...fitLambdas(o));
  const price=(id,margin)=>{let w=0,v=0;for(let i=0;i<N;i++)for(let j=0;j<N;j++){const r=pred(id,i,j);if(r===true)w+=P[i][j];else if(r===null)v+=P[i][j]}
    if(v>=0.999)return null;const f=w/(1-v);if(f<0.004)return null;return nice(1/(f*margin))};
  const G=[];
  const g=(key,title,cat,sels,margin,cols)=>G.push({key,title,cat,cols,sels:sels.map(([id,label,fixed])=>({id,label,odds:fixed??price(id,margin)})).filter(s=>s.odds)});
  g("1x2","תוצאת סיום","main",[["1x2:H",H,o.h],["1x2:D","תיקו",o.d],["1x2:A",A,o.a]],1,3);

  g("dnb","תיקו = החזר","main",[["dnb:H",H],["dnb:A",A]],1.05,2);
  g("btts","שתי הקבוצות מבקיעות","goals",[["btts:Y","כן"],["btts:N","לא"]],1.06,2);
  for(const L of ["0.5","1.5","2.5","3.5","4.5","5.5"]){

    g("ou"+L,"סה\"כ שערים "+L,"goals",[["ou:"+L+":O","מעל "+L,fixed?o.o:undefined],["ou:"+L+":U","מתחת "+L,fixed?o.u:undefined]],1.06,2);
  }
  g("tg","מספר שערים מדויק","goals",[0,1,2,3,4,5,6].map(n=>["tg:"+n,n===6?"6+":String(n)]),1.12);
  g("oe","זוגי / אי-זוגי","goals",[["oe:O","אי-זוגי"],["oe:E","זוגי"]],1.06,2);
  for(const [side,name] of [["htg",H],["atg",A]])for(const L of ["0.5","1.5","2.5"])
    g(side+L,"שערים של "+name+" "+L,"teams",[[side+":"+L+":O","מעל "+L],[side+":"+L+":U","מתחת "+L]],1.07,2);
  g("cln","שער נקי","teams",[["cln:H:Y",H+" שומרת על רשת נקייה"],["cln:A:Y",A+" שומרת על רשת נקייה"]],1.08,2);
  g("wtn","ניצחון בלי לספוג","teams",[["wtn:H",H],["wtn:A",A]],1.08,2);
  for(const L of ["-2.5","-1.5","-0.5","+0.5","+1.5","+2.5"]){
    const v=+L, inv=ltr((v>0?"-":"+")+Math.abs(v).toFixed(1)), Lr=ltr(L);
    g("ah"+L,"הנדיקפ "+H+" "+Lr,"hcp",[["ah:"+v+":H",H+" ("+Lr+")"],["ah:"+v+":A",A+" ("+inv+")"]],1.06,2);

  g("rb","תוצאה + שתיהן מבקיעות","combo",[["rb:H:Y",H+" + כן"],["rb:H:N",H+" + לא"],["rb:D:Y","תיקו + כן"],["rb:D:N","תיקו + לא"],["rb:A:Y",A+" + כן"],["rb:A:N",A+" + לא"]],1.12,2);
  g("ro","תוצאה + שערים 2.5","combo",[["ro:H:O",H+" + מעל"],["ro:H:U",H+" + מתחת"],["ro:D:O","תיקו + מעל"],["ro:D:U","תיקו + מתחת"],["ro:A:O",A+" + מעל"],["ro:A:U",A+" + מתחת"]],1.12,2);

}

function slipOutcome(slip,voided){
  if(voided)return{state:"void",ret:slip.stake,mult:1};
  let mult=1,pending=false,allVoid=true;
  for(const l of slip.legs){
    const m=S.matches.get(l.m);
    if(!m){pending=true;allVoid=false;continue}
    if(m.status==="void")continue;
    if(m.status==="final"&&m.result){const r=pred(l.s,m.result.h,m.result.a);
      if(r===false)return{state:"lost",ret:0,mult:0};
      if(r===true){mult*=l.o;allVoid=false}
    }else{pending=true;allVoid=false}
  }
  if(pending)return{state:"pending",ret:0,mult};
  if(allVoid)return{state:"void",ret:slip.stake,mult:1};
  return{state:"won",ret:slip.stake*mult,mult};
}

}

function oddFields(sport){

    :[["h","1"],["d","X"],["a","2"],["o","מעל 2.5"],["u","מתחת 2.5"]];

function readOdds(sport,prefix){
  const od={};for(const [k,,isLine] of oddFields(sport)){const v=+document.getElementById(prefix(k)).value;
    if(isLine?!(isFinite(v)&&Math.abs(v%1)===0.5):!(v>=1.01))return null;od[k]=v}

/* ---------- paste odds ---------- */
function normName(s){
  return " "+String(s)
    .replace(/ת["״׳']?א(?![א-ת])/g,"תל אביב").replace(/ב["״]ש/g,"באר שבע").replace(/פ["״]ת/g,"פתח תקווה").replace(/ק["״]ש/g,"קריית שמונה").replace(/י-ם/g,"ירושלים")
    .replace(/קרית/g,"קריית").replace(/תקוה/g,"תקווה")
    .replace(/[״"׳'`’()\[\],:|\/]/g," ").replace(/(?<!\d)\.|\.(?!\d)/g," ").replace(/-(?![\d.])/g," ").replace(/–|—/g," ")
    .replace(/\s+/g," ").trim()+" ";
}
function parsePaste(text){
  const T=normName(text), found=[];
  const open=[...S.matches.values()].filter(m=>m.status==="open"&&Date.now()<Date.parse(m.kickoff));
  for(const m of open){
    const H=normName(m.home).trim(),A=normName(m.away).trim();
    let i=-1;
    while((i=T.indexOf(" "+H+" ",i+1))>=0){
      const j=T.indexOf(" "+A+" ",i+H.length);
      if(j<0||j-i>160)continue;
      found.push({m,start:i,end:j+A.length+1});break;
    }
  }
  found.sort((a,b)=>a.start-b.start);
  return found.map((f,k)=>{
    const seg=T.slice(f.end,k+1<found.length?found[k+1].start:f.end+260);
    const nums=(seg.match(/[+-]?\d+(?:\.\d+)?/g)||[]).map(Number);
    const prices=nums.filter(x=>x>=1.01&&x<=200&&String(x).includes("."));
    const m=f.m,bb=isBB(m),v={...m.odds};let got=0;
    if(bb){if(prices.length>=2){v.h=prices[0];v.a=prices[1];got=2}}
    else if(prices.length>=3){v.h=prices[0];v.d=prices[1];v.a=prices[2];got=3}
    return{id:m.id,vals:v,on:got>0,got};
  });
}

function slipCode(pid,c){return "CL1~"+pid+"~"+c.mode+"~"+c.stake+"~"+c.legs.map(l=>l.m+"|"+l.s+"|"+l.info.odds).join("~")}
function slipText(pid,c){
  const lines=c.legs.map((l,i)=>`${i+1}. ${l.match.home} – ${l.match.away} · ${l.info.market}: ${l.info.label} @ ${fmtO(l.info.odds)}`);
  return `טופס לליגת הצ'יפים – ${nameOf(pid)}\n${lines.join("\n")}\n${c.mode==="combo"?"קומבינציה":"בודדים"} · סכום ${c.mode==="combo"?c.stake:c.stake+" לכל הימור"} · זכייה אפשרית ${n0(c.win)}\n${slipCode(pid,c)}`;
}
function parseSlips(text){
  const out=[];
  for(const code of (text.match(/CL1~[^\s]+/g)||[])){
    const [,pid,mode,stake,...legs]=code.split("~");
    const r={pid,mode:mode==="combo"?"combo":"single",stake:Math.floor(+stake)||0,legs:[],errs:[]};
    if(!S.players.has(pid))r.errs.push("השחקן לא קיים בליגה");
    for(const lg of legs){const [m,sid,o]=lg.split("|");const mt=S.matches.get(m);
      if(!mt){r.errs.push("משחק שלא קיים");continue}
      const info=selLabel(mt,sid);
      if(!isOpen(mt))r.errs.push(mt.home+" – "+mt.away+": סגור להימורים");
      if(!info.odds){r.errs.push("בחירה לא תקינה");continue}
      r.legs.push({m,s:sid,o:info.odds,asked:+o,match:mt,info})}
    if(r.mode==="combo"&&new Set(r.legs.map(l=>l.m)).size<r.legs.length)r.errs.push("קומבינציה עם שני הימורים מאותו משחק");
    const total=r.mode==="combo"?r.stake:r.stake*r.legs.length;r.total=total;
    if(r.stake<1)r.errs.push("סכום לא תקין");
    if(S.players.has(pid)&&total>account(pid).balance)r.errs.push("אין מספיק צ'יפים (יתרה "+n0(account(pid).balance)+")");
    out.push(r)}
  return out;
}

/* ---------- slip ---------- */
function slipCalc(){
  const legs=S.slip.map(l=>{const m=S.matches.get(l.m);const info=m?selLabel(m,l.s):null;return{...l,m:l.m,match:m,info,ok:m&&isOpen(m)&&info&&info.odds}});
  const sameMatch=new Set(),dup=new Set();for(const l of legs){if(sameMatch.has(l.m))dup.add(l.m);sameMatch.add(l.m)}
  const comboOk=legs.length>1&&!dup.size;
  const mode=legs.length<2?"single":(S.mode==="combo"&&!comboOk?"single":S.mode);
  const stake=Math.max(0,Math.floor(+S.stake||0));
  const totOdds=legs.reduce((x,l)=>x*(l.info?.odds||1),1);
  const total=mode==="combo"?stake:stake*legs.length;
  const win=mode==="combo"?stake*totOdds:legs.reduce((x,l)=>x+stake*(l.info?.odds||0),0);
  return{legs,dup,comboOk,mode,stake,totOdds,total,win};
}

  $("#scrim").innerHTML=S.sheet?`<div class="scrim" data-sheet="close"></div>`:"";
  bar.hidden=!S.slip.length||S.sheet;
  bar.innerHTML=`<span class="cnt">${S.slip.length}</span><b>טופס ההימור</b><span class="num">${c.mode==="combo"?"יחס "+fmtO(Math.round(c.totOdds*100)/100):"זכייה "+n0(c.win)}</span>`;
}
function slipError(c,me){
  if(!S.db||!S.uid)return"צריך להתחבר כדי להמר.";
  if(!me)return viewerMode()?"בחרו את השם שלכם למעלה כדי להמר.":S.isOwner?"הוסיפו שחקנים בלשונית ניהול.":"הצטרפו לליגה כדי להמר.";
  if(c.legs.some(l=>!l.ok))return"יש בטופס בחירה שנסגרה. הסירו אותה.";
  if(c.stake<1)return"הזינו סכום.";
  const max=+S.settings.maxStake||0;
  if(max&&c.total>max)return"ההימור המקסימלי לטופס הוא "+n0(max)+".";
  if(c.total>me.balance)return"אין מספיק צ'יפים. היתרה "+n0(me.balance)+".";
  return"";
}
async function placeBet(){
  const bid=bettorId();if(!bid)return;
  const c=slipCalc(),me=account(bid);if(slipError(c,me))return;
  S.busy=true;renderSlip();
  const add=makeSlips(c.mode,c.stake,c.legs.map(l=>({m:l.m,s:l.s,o:l.info.odds})));
  try{
    await writeSlips(bid,add);
    S.slip=[];S.sheet=false;toast((add.length>1?add.length+" הימורים נשלחו":"ההימור נשלח")+(bid!==S.uid?" עבור "+nameOf(bid):""));
  }catch(e){toast(e&&e.message?e.message:"השליחה נכשלה. נסו שוב.")}
  S.busy=false;render();
}

/* ---------- supabase ---------- */
const SB_URL="https://dihuzezrjylrohguyyuu.supabase.co", SB_KEY="sb_publishable_IeYdkT-xmB2uxMPM6N0u9g_k_FB7HOb";
const TABLES=["matches","profiles","bets","ledger","config"];
let sb=null;
function fail(r){if(r.error)throw{code:"rejected",message:r.error.message};return r}
function sbDoc(path){
  const [col,id]=path.split("/");
  return{
    async set(data){
      if(col==="matches")fail(await sb.from("matches").upsert({id,doc:data}));
      else if(col==="ledger")fail(await sb.from("ledger").upsert({user_id:id,adjust:+data.adjust||0,voided:data.voided||[],log:data.log||[]}));
      else if(col==="config")fail(await sb.from("config").upsert({id,doc:data}));
      else throw{code:"rejected",message:"unsupported"};
      await reload(col);
    },
    async update(patch){
      const cur=S.matches.get(id);if(col!=="matches"||!cur)throw{code:"rejected",message:"not found"};
      const {id:_drop,...doc}=cur;fail(await sb.from("matches").upsert({id,doc:{...doc,...patch}}));await reload("matches");
    },
    async delete(){if(col==="matches"){fail(await sb.from("matches").delete().eq("id",id));await reload("matches")}}
  };
}
async function reload(t){
  if(!sb||!S.session)return;
  if(t==="matches"){const {data}=await sb.from("matches").select("id,doc").limit(5000);if(data){S.matches=new Map(data.filter(r=>!HIDDEN_LEAGUES.has(r.doc&&r.doc.league)).map(r=>[r.id,{id:r.id,...r.doc}]));S.slip=S.slip.filter(l=>S.matches.has(l.m))}}
  if(t==="profiles"){const {data}=await sb.from("profiles").select("id,nick,is_admin");if(data){S.players=new Map(data.map(r=>[r.id,{nick:r.nick,is_admin:r.is_admin}]));S.isOwner=!!S.players.get(S.uid)?.is_admin}}
  if(t==="bets"){const {data}=await sb.from("bets").select("id,user_id,stake,legs,created_at").order("created_at").limit(10000);
    if(data){const m=new Map();for(const r of data){if(!m.has(r.user_id))m.set(r.user_id,{slips:[]});m.get(r.user_id).slips.push({id:r.id,t:Date.parse(r.created_at),stake:r.stake,legs:r.legs})}S.bets=m}}
  if(t==="ledger"){const {data}=await sb.from("ledger").select("*");if(data)S.ledger=new Map(data.map(r=>[r.user_id,{adjust:r.adjust,voided:r.voided||[],log:r.log||[]}]))}
  if(t==="config"){const {data}=await sb.from("config").select("doc").eq("id","settings").maybeSingle();if(data)S.settings={startChips:1000,...data.doc}}
  schedule();
}
const loadAll=()=>Promise.all(TABLES.map(reload));
let chan=null;const pend=new Set();let flushT=null;
function subscribe(){
  if(chan)return;chan=sb.channel("league");
  for(const t of TABLES)chan.on("postgres_changes",{event:"*",schema:"public",table:t},()=>{pend.add(t);clearTimeout(flushT);flushT=setTimeout(()=>{const ts=[...pend];pend.clear();ts.forEach(reload)},350)});
  chan.subscribe();
  setInterval(()=>{if(S.session)loadAll()},60000);
  setInterval(()=>{if(S.isOwner&&!S.busy)syncMatches(true)},10*60000); // admin: keep pulling bot updates
  setInterval(()=>{if(S.view==="games"||S.view==="admin")schedule()},30000); // close betting as kickoffs pass
}
async function nickEmail(nick){
  const norm=nick.trim().replace(/\s+/g," ").toLowerCase();
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(norm));
  return "u"+[...new Uint8Array(buf)].slice(0,16).map(b=>b.toString(16).padStart(2,"0")).join("")+"@chipsleague.com";
}
function authView(){
  const reg=S.authMode==="register";
  return `<div class="card" style="max-width:420px;margin:28px auto;display:grid;gap:14px">
    <div><h2 style="margin:0;font-family:var(--f-display);font-weight:400;font-size:26px">${reg?"הרשמה לליגה":"כניסה לליגה"}</h2>
    <p style="margin:4px 0 0;color:var(--muted)">${reg?"בחרו כינוי וסיסמה. תקבלו "+n0(S.settings.startChips||1000)+" צ'יפים להתחלה.":"הימורים בין חברים, בצ'יפים ולא בכסף אמיתי."}</p></div>
    <div class="seg"><button data-authmode="login" aria-pressed="${!reg}">כניסה</button><button data-authmode="register" aria-pressed="${reg}">הרשמה</button></div>
    <form id="authForm" style="display:grid;gap:12px">
      <div class="field"><label for="au-nick">כינוי</label><input class="inp" id="au-nick" maxlength="24" required autocomplete="username"></div>
      <div class="field"><label for="au-pw">סיסמה${reg?" (לפחות 6 תווים)":""}</label><input class="inp" id="au-pw" type="password" minlength="6" required autocomplete="${reg?"new-password":"current-password"}"></div>
      ${S.authErr?`<div class="err">${esc(S.authErr)}</div>`:""}
      <button class="btn" ${S.busy?"disabled":""}>${S.busy?"רגע…":reg?"הרשמה":"כניסה"}</button>
    </form></div>`;
}
async function doAuth(){
  const nick=$("#au-nick").value.trim().replace(/\s+/g," ").slice(0,24),pw=$("#au-pw").value;
  if(!nick||pw.length<6)return;
  S.busy=true;S.authErr=null;renderView();
  try{
    const email=await nickEmail(nick);
    if(S.authMode==="register"){
      const {data:taken}=await sb.rpc("nick_taken",{p_nick:nick}).then(r=>r,()=>({data:false}));
      if(taken)throw new Error("הכינוי הזה כבר תפוס. בחרו כינוי אחר.");
      const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{nick}}});
      if(error)throw new Error(/registered|exists/i.test(error.message)?"הכינוי הזה כבר תפוס. בחרו כינוי אחר.":"ההרשמה נכשלה: "+error.message);
      if(!data.session)throw new Error("ההרשמה נקלטה, אבל צריך לכבות ב-Supabase את Confirm email כדי להיכנס.");
    }else{
      const {error}=await sb.auth.signInWithPassword({email,password:pw});
      if(error)throw new Error("כינוי או סיסמה לא נכונים.");
    }
  }catch(e){S.authErr=e.message||"משהו השתבש. נסו שוב."}
  S.busy=false;renderView();
}
async function onSession(session){
  S.session=session||null;S.uid=session?.user?.id||null;S.canWrite=true;
  if(!session){S.isOwner=false;S.players=new Map();S.bets=new Map();S.ledger=new Map();S.ready=true;render();return}
  await loadAll();
  if(!S.players.has(S.uid)){
    const nick=(session.user.user_metadata&&session.user.user_metadata.nick)||"שחקן";
    const r=await sb.from("profiles").insert({id:S.uid,nick});
    if(r.error)toast("הכינוי תפוס. התנתקו ונרשמו עם כינוי אחר.");
    await reload("profiles");
  }
  S.ready=true;render();subscribe();
  if(S.isOwner&&S.matches.size)syncMatches(true); // admin: pull in new matches and odds automatically
}
async function seedMatches(){
  S.busy=true;renderView();
  try{
    const rows=await (await fetch("matches.json?t="+Date.now(),{cache:"no-store"})).json();
    for(let k=0;k<rows.length;k+=100)fail(await sb.from("matches").upsert(rows.slice(k,k+100)));
    await reload("matches");toast(rows.length+" משחקים נטענו");
  }catch(e){toast("הטעינה נכשלה: "+(e.message||""))}
  S.busy=false;render();
}
async function syncMatches(silent){
  if(!silent){S.busy=true;renderView()}
  try{
    const rows=await (await fetch("matches.json?t="+Date.now(),{cache:"no-store"})).json();
    const up=[];let added=0,updated=0,results=0;
    for(const r of rows){
      const cur=S.matches.get(r.id);
      if(HIDDEN_LEAGUES.has(r.doc.league))continue;
      if(!cur){up.push(r);added++;continue}
      if(cur.status!=="open")continue;
      const {id:_drop,...doc}=cur;
      let next={...doc};
      if(cur.source!=="market")next={...next,odds:r.doc.odds,kickoff:r.doc.kickoff,tbc:r.doc.tbc,round:r.doc.round,source:r.doc.source,sourceNote:r.doc.sourceNote};
      if(!cur.botSkip){
        if(r.doc.status==="final"&&r.doc.result){next={...next,status:"final",result:r.doc.result,resultBy:"bot",resultNote:r.doc.resultNote||""};delete next.botIssue;results++}
        else if(r.doc.botIssue)next.botIssue=r.doc.botIssue;
        else delete next.botIssue;
      }
      if(JSON.stringify(next)!==JSON.stringify(doc)){up.push({id:r.id,doc:next});updated++}
    }
    for(let k=0;k<up.length;k+=100)fail(await sb.from("matches").upsert(up.slice(k,k+100)));
    await reload("matches");if(!silent||added||updated)toast(`נוספו ${added} משחקים, עודכנו ${updated}`+(results?` · ${results} תוצאות`:""));
  }catch(e){toast("עדכון המשחקים נכשל: "+(e.message||""))}
  if(!silent){S.busy=false;render()}
}
async function boot(){
  if(!window.supabase){S.ready=true;render();$("#view").innerHTML=`<div class="notice warn"><h3>לא הצלחנו להתחבר</h3><p>רעננו את הדף. אם זה חוזר, בדקו את החיבור לאינטרנט.</p></div>`;return}
  sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  S.db={doc:sbDoc};
  const {data}=await sb.auth.getSession();
  await onSession(data.session);
  sb.auth.onAuthStateChange((_e,s)=>{if((s?.user?.id||null)!==(S.uid||null))onSession(s);else S.session=s});
}
boot();
